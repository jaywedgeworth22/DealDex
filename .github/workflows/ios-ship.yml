name: iOS TestFlight ship (GitHub-hosted macOS)

# Archive + upload on GitHub-hosted macos-latest (fleet protocol 2026-08-24:
# GH-hosted runners for iOS ships and everything else; local Mac self-hosted
# runners are banned). Ubuntu CI stays web-only. Fork PRs never run here.
#
# Signing + ASC keys come from repo secrets (same names as Congress.Trade):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8,
#   IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD
# scripts/ios-appstore-gm-prepare.sh writes ~/.secrets/appstore-connect.env
# and imports the Distribution identity. Values are never printed.
#
# The in-repo wrapper prefers scripts/ios-fleet/, then
# /Users/jay/apps/ios-fleet. App key `dealdex`, bundle `net.dealdex`.
# Marketing train is 1.0.N; build is UTC YYYYMMDDHHMM.
#
# Bundle `net.dealdex` and team `CC8UTF7ATG` are unchanged here.
# The Apple Developer portal App ID resource is not a team id.

on:
  push:
    branches: [main]
    paths:
      - 'native/ios/**'
      - '.github/workflows/ios-ship.yml'
      - 'scripts/ios-fleet/**'
      - 'scripts/ios-ship-testflight.sh'
      - 'scripts/ios-appstore-gm-prepare.sh'
  workflow_dispatch:
  schedule:
    # Twice an hour, offset from Socratic.Trade ('*/30'), Congress.Trade
    # ('7,37'), and Usage-Monitor ('13,43').
    - cron: '22,52 * * * *'

# WHY THE CRON EXISTS, AND WHY IT NEEDS A GATE
# --------------------------------------------
# `push:` alone is not a reliable trigger. A PR merged by github-actions[bot]
# lands on main under GitHub's recursion guard and dispatches NOTHING (measured
# on Socratic.Trade PR #2675 and Congress.Trade PR #1835). So iOS code can
# reach main and never reach a phone, and the cron is what notices.
#
# But a cron carries no `paths:` filter, and the ship script's own gate only
# knows "is HEAD the sha I last shipped" plus a time interval -- neither of
# which knows whether native/ios/ changed. Siblings already paid for that gap
# (Socratic.Trade run 31723515355 shipped a pure-backend alerts fix). The
# "Scheduled ship gate" step below is what stops that, and it is why this
# workflow can keep a 30-minute tick without spamming TestFlight.

permissions:
  contents: read

concurrency:
  group: ios-ship-dealdex
  cancel-in-progress: false

jobs:
  ship:
    name: TestFlight archive + upload
    if: github.event.repository.fork == false
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      # fetch-depth: 0 is load-bearing, not hygiene. The default depth-1
      # checkout leaves the runner workspace with exactly ONE commit, so
      # `git log <last-shipped-sha>..HEAD` fails with "unknown revision" and
      # both the scheduled gate and TestFlight release notes go empty.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # Runs FIRST so a tick with nothing to ship costs seconds and cannot go
      # red on an unrelated environment problem. The logic lives in a script,
      # not inline YAML, so Ubuntu CI can unit-test it on every PR -- otherwise
      # it would only ever execute on the hosted runner that can ship.
      - name: Scheduled ship gate (skip unless iOS code changed)
        id: gate
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ios-scheduled-ship-gate.sh" \
            --event "${{ github.event_name }}" \
            --path-prefix 'native/ios/' \
            --repo-root "$GITHUB_WORKSPACE" \
            dealdex

      - name: Assert stable Xcode (never beta)
        if: steps.gate.outputs.should_ship == '1'
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          ver=$(xcodebuild -version | awk 'NR==1{print $2}')
          echo "Xcode version: ${ver}"
          case "$DEVELOPER_DIR" in
            *[Bb]eta*)
              echo "::error::DEVELOPER_DIR resolves to a beta Xcode: $DEVELOPER_DIR"
              exit 1
              ;;
          esac


      # Identity stays on GitHub.  Apple/iOS signing material comes from Infisical prod.
      - name: Load Infisical signing secrets
        if: steps.gate.outputs.should_ship == '1'
        env:
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set +o xtrace
          set -euo pipefail
          export INFISICAL_DISABLE_UPDATE_CHECK=true

          if ! command -v infisical >/dev/null 2>&1; then
            NONINTERACTIVE=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install infisical/get-cli/infisical
          fi
          command -v infisical >/dev/null 2>&1 || {
            echo "::error::Infisical CLI is not installed."
            exit 1
          }

          if [ -z "${INFISICAL_PROJECT_ID}" ]; then
            echo "::error::Missing INFISICAL_PROJECT_ID GitHub secret."
            exit 1
          fi
          CLIENT_ID="${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}"
          CLIENT_SECRET="${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}"
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            CLIENT_ID="${INFISICAL_CLIENT_ID}"
            CLIENT_SECRET="${INFISICAL_CLIENT_SECRET}"
          fi
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Missing Infisical machine identity.  Set INFISICAL_UNIVERSAL_AUTH_CLIENT_ID/SECRET (fallback INFISICAL_CLIENT_ID/SECRET) on the repo."
            exit 1
          fi

          TOKEN="$(
            env -u INFISICAL_CLIENT_ID -u INFISICAL_CLIENT_SECRET -u INFISICAL_TOKEN \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_ID="$CLIENT_ID" \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET="$CLIENT_SECRET" \
              infisical login --method=universal-auth --silent --plain --telemetry=false 2>/dev/null || true
          )"
          if [ -z "$TOKEN" ]; then
            echo "::error::Infisical universal-auth login failed."
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 \
                      IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD; do
            val="$(
              INFISICAL_TOKEN="$TOKEN" infisical secrets get "$name" \
                --plain --silent --telemetry=false --expand=false \
                --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/ \
                2>/dev/null || true
            )"
            if [ -z "$val" ]; then
              continue
            fi
            echo "::add-mask::$val"
            {
              echo "${name}<<INFISICAL_EOF"
              printf '%s\n' "$val"
              echo "INFISICAL_EOF"
            } >> "$GITHUB_ENV"
          done
          unset TOKEN CLIENT_ID CLIENT_SECRET val

      - name: Import signing + ASC key
        if: steps.gate.outputs.should_ship == '1'
        run: |
          # Do not put `secrets.*` in `if:` — GitHub rejects that named-value
          # on this repo (HTTP 422).  Empty env means the secret is unset.
          if [ -z "${ASC_KEY_ID}" ]; then
            echo "::error::ASC_KEY_ID empty after Infisical prod export. Confirm ASC_/IOS_DIST_ names exist in Infisical env=prod."
            exit 1
          fi
          bash "$GITHUB_WORKSPACE/scripts/ios-appstore-gm-prepare.sh"

      # Route through the in-repo wrapper. scripts/ios-ship-testflight.sh
      # execs scripts/ios-fleet/ship-testflight.sh (DealDex apps.json is
      # net.dealdex, 1.0.N).
      #
      # No IOS_TF_MIN_INTERVAL_SEC here. Standing gate is
      # DEFAULT_MIN_INTERVAL_SEC=3600 (1 hour) in the fleet script. The
      # 30-minute cron picks up an unbuilt merge on the next eligible hour;
      # same-HEAD ticks still exit 0 without shipping.
      - name: Ship DealDex to TestFlight
        if: steps.gate.outputs.should_ship == '1'
        run: bash scripts/ios-ship-testflight.sh
