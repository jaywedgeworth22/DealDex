<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..600,0..100,0..1&family=IBM+Plex+Sans:wght@400;500&display=swap" />
    <style>
      html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #ffffff;
        color: #1a1b16;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      .frame {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 48px 64px;
        background: #ffffff;
        position: relative;
      }
      .rule {
        position: absolute;
        inset: 24px;
        border: 1px solid rgba(26, 27, 22, 0.1);
        pointer-events: none;
      }
      /* 840px = 70% of 1200.  Cap at 75% so the mark fills 2/3–3/4 of the card. */
      .wordmark {
        display: block;
        width: 840px;
        height: auto;
        max-width: 75%;
        object-fit: contain;
        object-position: left center;
      }
      p {
        margin: 18px 0 0;
        font-size: 28px;
        color: #5c5a52;
        letter-spacing: 0.01em;
        max-width: 920px;
        line-height: 1.3;
      }
      .foot {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 44px;
        display: flex;
        justify-content: space-between;
        color: #6f6c63;
        font-size: 16px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="rule"></div>
      <img class="wordmark" src="../public/marks/dealdex-wordmark.png" alt="DealDex" />
      <p>Identify Best-Priced Pokémon Card Listings</p>
      <div class="foot">
        <span>eBay · Mercari · TCGPlayer</span>
        <span>dealdex.net</span>
      </div>
    </div>
  </body>
</html>
