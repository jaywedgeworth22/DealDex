<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" />
    <style>
      html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #ffffff;
        color: #1a1b16;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      .frame {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 20px 24px 108px;
        background: #ffffff;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .wordmark {
        display: block;
        width: 1160px;
        height: auto;
        max-height: 400px;
        object-fit: contain;
        object-position: center;
      }
      p {
        margin: 8px 0 0;
        font-size: 52px;
        font-weight: 500;
        color: #2e2d28;
        letter-spacing: -0.02em;
        max-width: 1100px;
        line-height: 1.15;
        text-align: center;
      }
      .foot {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
      }
      .foot img {
        display: block;
        height: 34px;
        width: auto;
      }
      .domain {
        color: #5a5850;
        font-size: 32px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <img class="wordmark" src="../public/marks/dealdex-wordmark.png" alt="DealDex" />
      <p>Find the best-priced Pokémon card listings</p>
      <div class="foot">
        <img src="../public/marks/ebay.svg" alt="eBay" />
        <span class="domain">DealDex.net</span>
        <img src="../public/marks/mercari.svg" alt="Mercari" />
      </div>
    </div>
  </body>
</html>
