<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" />
    <style>
      html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #ffffff;
        color: #1a1b16;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      .frame {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 36px 40px 88px;
        background: #ffffff;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: stretch;
      }
      .rule {
        position: absolute;
        inset: 18px;
        border: 1px solid rgba(26, 27, 22, 0.1);
        pointer-events: none;
      }
      .wordmark {
        display: block;
        width: auto;
        height: 400px;
        max-width: 1120px;
        max-height: 64%;
        object-fit: contain;
        object-position: left center;
      }
      p {
        margin: 16px 0 0;
        font-size: 48px;
        font-weight: 500;
        color: #5c5a52;
        letter-spacing: 0.01em;
        max-width: 1120px;
        line-height: 1.2;
      }
      .foot {
        position: absolute;
        left: 40px;
        right: 40px;
        bottom: 32px;
        display: flex;
        justify-content: space-between;
        color: #6f6c63;
        font-size: 18px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="rule"></div>
      <img class="wordmark" src="../public/marks/dealdex-wordmark.png" alt="DealDex" />
      <p>Identify Best-Priced Pokémon Card Listings</p>
      <div class="foot">
        <span>eBay · Mercari</span>
        <span>dealdex.net</span>
      </div>
    </div>
  </body>
</html>
