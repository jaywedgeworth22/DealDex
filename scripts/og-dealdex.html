<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .frame {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wordmark {
        display: block;
        width: 88%;
        max-width: 1056px;
        height: auto;
        max-height: 78%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <img class="wordmark" src="../public/marks/dealdex-wordmark.png" alt="DealDex" />
    </div>
  </body>
</html>
