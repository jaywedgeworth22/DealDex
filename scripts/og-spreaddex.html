<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap" />
    <style>
      html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #0c0d0b;
        color: #eceae4;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      .frame {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 72px 88px;
        background:
          radial-gradient(900px 420px at 78% 18%, rgba(228, 223, 210, 0.06), transparent 62%),
          linear-gradient(180deg, #12130f 0%, #0c0d0b 100%);
        position: relative;
      }
      .rule {
        position: absolute;
        inset: 28px;
        border: 1px solid rgba(236, 234, 228, 0.1);
        pointer-events: none;
      }
      .mark {
        width: 44px;
        height: 44px;
        border: 1px solid rgba(228, 223, 210, 0.4);
        border-radius: 6px;
        display: grid;
        place-items: center;
        color: #e4dfd2;
        font-family: "Fraunces", serif;
        font-size: 26px;
        line-height: 1;
      }
      h1 {
        margin: 48px 0 0;
        font-family: "Fraunces", serif;
        font-weight: 500;
        font-size: 112px;
        letter-spacing: -0.03em;
        line-height: 0.92;
      }
      p {
        margin: 22px 0 0;
        font-size: 28px;
        color: #9a978c;
        letter-spacing: 0.01em;
      }
      .foot {
        position: absolute;
        left: 88px;
        right: 88px;
        bottom: 64px;
        display: flex;
        justify-content: space-between;
        color: #6f6c63;
        font-size: 16px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="rule"></div>
      <div class="mark">Δ</div>
      <h1>DealDex</h1>
      <p>Find the best listings. Keep the cheap ones.</p>
      <div class="foot">
        <span>eBay · Mercari · TCGPlayer</span>
        <span>Pokémon listing desk</span>
      </div>
    </div>
  </body>
</html>
