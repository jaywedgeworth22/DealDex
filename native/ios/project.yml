name: DealDex
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CC8UTF7ATG
targets:
  DealDex:
    type: application
    platform: iOS
    bundleId: me.grok.dealdex
    sources:
      - path: DealDex
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: DealDex/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: me.grok.dealdex
        PRODUCT_NAME: DealDex
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CC8UTF7ATG
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  DealDex:
    build:
      targets:
        DealDex: all
    run:
      config: Debug
    archive:
      config: Release
