# iOS identity — do not mix these up:
#   Bundle ID: online.dealdex
#   Apple Developer bundle resource ID: R2FAW69NPD
#     (NOT a team ID. Never put R2FAW69NPD in DEVELOPMENT_TEAM or any team field.)
#   DEVELOPMENT_TEAM / Apple team ID: CC8UTF7ATG
# Apple App ID online.dealdex is registered with IAP. ASC app record (SKU dealdex)
# does not exist yet — do not upload to TestFlight.
name: DealDex
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CC8UTF7ATG
targets:
  DealDex:
    type: application
    platform: iOS
    bundleId: online.dealdex
    sources:
      - path: DealDex
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: DealDex/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: online.dealdex
        PRODUCT_NAME: DealDex
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CC8UTF7ATG
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  DealDex:
    build:
      targets:
        DealDex: all
    run:
      config: Debug
    archive:
      config: Release
